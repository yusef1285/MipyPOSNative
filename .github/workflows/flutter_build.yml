name: Flutter Android Signed Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Force-correct Android configuration
        run: |
          echo "plugins { id 'com.android.application' }" > android/app/build.gradle
          echo "android { namespace 'com.mipypos.native'; compileSdk 34; defaultConfig { applicationId 'com.mipypos.native'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0'; } buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } } }" >> android/app/build.gradle
          echo "def flutterRoot = localProperties.getProperty('flutter.sdk')" >> android/app/build.gradle
          echo "apply from: \"\$flutterRoot/packages/flutter_tools/gradle/flutter.gradle\"" >> android/app/build.gradle

          echo "buildscript { repositories { google(); mavenCentral(); } dependencies { classpath 'com.android.tools.build:gradle:8.2.1' } } allprojects { repositories { google(); mavenCentral(); } }" > android/build.gradle

          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.keystore

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
