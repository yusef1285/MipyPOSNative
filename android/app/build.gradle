plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.mipypos.native"
    compileSdk 34

    defaultConfig {
        applicationId "com.mipypos.native"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot != null) {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
}
